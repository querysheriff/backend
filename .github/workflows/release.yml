name: release

# Run this workflow whenever a Git tag starting with "v" is pushed.
# Example: v0.0.10
on:
  push:
    tags: ['v*']

# Allow this workflow to push Docker images to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # Build the Debian package and publish a GitHub Release.
  image:
    runs-on: ubuntu-latest
    steps:
      # Check out the exact commit/tag that triggered this workflow.
      - uses: actions/checkout@v7

      # Log in to GitHub Container Registry (ghcr.io).
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert the Git tag into Docker image tags.
      # Example: v0.0.10 -> ghcr.io/querysheriff/backend:0.0.10
      # metadata-action also adds :latest for normal SemVer releases.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/querysheriff/backend
          tags: |
            type=semver,pattern={{version}}

      # Build the Docker image for Linux amd64 and push it to GHCR.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
