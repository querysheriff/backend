syntax = "proto3";

package querysheriff.v1;

option go_package = "github.com/querysheriff/backend/gen/querysheriff/v1;querysheriffv1";

service AlertService {
  rpc ListAlertSettings(ListAlertSettingsRequest) returns (ListAlertSettingsResponse) {}
  rpc UpdateAlertWebhook(UpdateAlertWebhookRequest) returns (UpdateAlertWebhookResponse) {}
  rpc UpdateAlertSetting(UpdateAlertSettingRequest) returns (UpdateAlertSettingResponse) {}
}

enum AlertLevel {
  ALERT_LEVEL_UNSPECIFIED = 0;
  ALERT_LEVEL_INFO = 1;
  ALERT_LEVEL_WARNING = 2;
  ALERT_LEVEL_CRITICAL = 3;
}

message ListAlertSettingsRequest {}

message ListAlertSettingsResponse {
  repeated ServerAlertSettings servers = 1;
}

message ServerAlertSettings {
  string server_name = 1;
  string slack_webhook_url = 2;
  repeated AlertSetting alerts = 3;
}

message AlertSetting {
  string key = 1;
  string title = 2;
  AlertLevel level = 3;
  bool enabled = 4;
  int64 fires_last_week = 5;
}

message UpdateAlertWebhookRequest {
  string server_name = 1;
  string slack_webhook_url = 2;
}

message UpdateAlertWebhookResponse {}

message UpdateAlertSettingRequest {
  string server_name = 1;
  string key = 2;
  bool enabled = 3;
}

message UpdateAlertSettingResponse {}
