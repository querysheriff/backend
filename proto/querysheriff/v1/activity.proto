syntax = "proto3";

package querysheriff.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/querysheriff/backend/gen/querysheriff/v1;querysheriffv1";

service ActivityService {
  rpc ReportActivity(ReportActivityRequest) returns (ReportActivityResponse) {}
  rpc QueryTransactions(QueryTransactionsRequest) returns (QueryTransactionsResponse) {}
  rpc QueryLockWaits(QueryLockWaitsRequest) returns (QueryLockWaitsResponse) {}
  rpc QueryLockWaitSeries(QueryLockWaitSeriesRequest) returns (QueryLockWaitSeriesResponse) {}
  rpc QueryTransactionAgeSeries(QueryTransactionAgeSeriesRequest) returns (QueryTransactionAgeSeriesResponse) {}
}

message ReportActivityRequest {
  google.protobuf.Timestamp collected_at = 1;
  repeated ActivitySnapshot activity_snapshots = 2;
}

message ReportActivityResponse {}

message ActivitySnapshot {
  int32 pid = 1;
  google.protobuf.Timestamp backend_start = 2;
  string database_name = 3;
  string user_name = 4;
  string application_name = 5;
  string state = 6;
  string wait_event_type = 7;
  string wait_event = 8;
  google.protobuf.Timestamp xact_start = 9;
  google.protobuf.Timestamp query_start = 10;
  int64 query_id = 11;
  string query = 12;
  map<string, string> query_tags = 13;
  int32 blocked_by_pid = 14;
  google.protobuf.Timestamp lock_wait_start = 15;
  string lock_mode = 16;
}

enum TransactionEventStatus {
  TRANSACTION_EVENT_STATUS_UNSPECIFIED = 0;
  TRANSACTION_EVENT_STATUS_ACTIVE = 1;
  TRANSACTION_EVENT_STATUS_IDLE = 2;
  TRANSACTION_EVENT_STATUS_ABORTED = 4;
}

enum TransactionSortColumn {
  TRANSACTION_SORT_COLUMN_UNSPECIFIED = 0;
  TRANSACTION_SORT_COLUMN_STARTED = 1;
  TRANSACTION_SORT_COLUMN_OPEN = 2;
}

message QueryTransactionsRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  int32 limit = 5;
  int32 offset = 6;
  TransactionSortColumn sort_column = 7;
  bool sort_desc = 8;
  int64 min_open_ms = 9;
}

message QueryTransactionsResponse {
  repeated Transaction transactions = 1;
  bool has_more = 2;
}

message Transaction {
  int32 pid = 1;
  string application_name = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
  repeated TransactionEvent events = 6;
}

message TransactionEvent {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  TransactionEventStatus status = 3;
  string query = 5;
  string wait_event_type = 7;
  string wait_event = 8;
  string lock_mode = 9;
  map<string, string> query_tags = 10;
  google.protobuf.Timestamp query_start = 11;
}

message QueryLockWaitSeriesRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message QueryLockWaitSeriesResponse {
  repeated LockWaitPoint series = 1;
  int64 bucket_ms = 2;
}

message LockWaitPoint {
  google.protobuf.Timestamp at = 1;
  double wait_seconds = 2;
}

enum LockWaitSortColumn {
  LOCK_WAIT_SORT_COLUMN_UNSPECIFIED = 0;
  LOCK_WAIT_SORT_COLUMN_STARTED = 1;
  LOCK_WAIT_SORT_COLUMN_WAITED = 2;
}

message QueryLockWaitsRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  int32 limit = 5;
  int32 offset = 6;
  LockWaitSortColumn sort_column = 7;
  bool sort_desc = 8;
}

message QueryLockWaitsResponse {
  repeated LockWait waits = 1;
  bool has_more = 2;
}

message LockWait {
  LockParty waiting = 1;
  LockParty blocking = 2;
  google.protobuf.Timestamp started_waiting = 3;
  google.protobuf.Timestamp last_seen = 4;
  string lock_mode = 5;
}

message LockParty {
  int32 pid = 1;
  string application_name = 2;
  string query = 3;
  map<string, string> query_tags = 4;
}

message QueryTransactionAgeSeriesRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message QueryTransactionAgeSeriesResponse {
  repeated TransactionAgePoint series = 1;
  int64 bucket_ms = 2;
}

message TransactionAgePoint {
  google.protobuf.Timestamp at = 1;
  double age_seconds = 2;
}
