syntax = "proto3";

package querysheriff.v1;

import "google/protobuf/timestamp.proto";
import "querysheriff/v1/common.proto";

option go_package = "github.com/querysheriff/backend/gen/querysheriff/v1;querysheriffv1";

service ActivityService {
  rpc ReportActivity(ReportActivityRequest) returns (ReportActivityResponse) {}

  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {}
  rpc GetTransactionAgeSeries(GetTransactionAgeSeriesRequest) returns (GetTransactionAgeSeriesResponse) {}
  rpc ListLockWaits(ListLockWaitsRequest) returns (ListLockWaitsResponse) {}
  rpc GetLockWaitSeries(GetLockWaitSeriesRequest) returns (GetLockWaitSeriesResponse) {}
}

message ReportActivityRequest {
  google.protobuf.Timestamp collected_at = 1;
  repeated ActivitySnapshot activity_snapshots = 2;
}

message ReportActivityResponse {}

message ActivitySnapshot {
  int32 pid = 1;
  google.protobuf.Timestamp backend_start = 2;
  string database_name = 3;
  string user_name = 4;
  string application_name = 5;
  string state = 6;
  string wait_event_type = 7;
  string wait_event = 8;
  google.protobuf.Timestamp xact_start = 9;
  google.protobuf.Timestamp query_start = 10;
  int64 query_id = 11;
  string query = 12;
  map<string, string> query_tags = 13;
  int32 blocked_by_pid = 14;
  google.protobuf.Timestamp lock_wait_start = 15;
  string lock_mode = 16;
}

enum TransactionSortColumn {
  TRANSACTION_SORT_COLUMN_UNSPECIFIED = 0;
  TRANSACTION_SORT_COLUMN_STARTED = 1;
  TRANSACTION_SORT_COLUMN_OPEN = 2;
}

message ListTransactionsRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  int64 min_open_ms = 5;
  TransactionSortColumn sort_column = 6;
  bool sort_desc = 7;
  int32 limit = 8;
  int32 offset = 9;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  bool has_more = 2;
}

message Transaction {
  int32 pid = 1;
  string application_name = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  repeated TransactionEvent events = 5;
}

enum TransactionEventStatus {
  TRANSACTION_EVENT_STATUS_UNSPECIFIED = 0;
  TRANSACTION_EVENT_STATUS_ACTIVE = 1;
  TRANSACTION_EVENT_STATUS_IDLE = 2;
  TRANSACTION_EVENT_STATUS_ABORTED = 3;
}

message TransactionEvent {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  TransactionEventStatus status = 3;
  string query = 4;
  google.protobuf.Timestamp query_start = 5;
  map<string, string> query_tags = 6;
  string wait_event = 7;
  string lock_mode = 8;
}

message GetTransactionAgeSeriesRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message GetTransactionAgeSeriesResponse {
  repeated MetricPoint age_seconds = 1;
  int64 bucket_ms = 2;
}

enum LockWaitSortColumn {
  LOCK_WAIT_SORT_COLUMN_UNSPECIFIED = 0;
  LOCK_WAIT_SORT_COLUMN_STARTED = 1;
  LOCK_WAIT_SORT_COLUMN_WAITED = 2;
}

message ListLockWaitsRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  LockWaitSortColumn sort_column = 5;
  bool sort_desc = 6;
  int32 limit = 7;
  int32 offset = 8;
}

message ListLockWaitsResponse {
  repeated LockWait waits = 1;
  bool has_more = 2;
}

message LockWait {
  LockParty waiting = 1;
  LockParty blocking = 2;
  string lock_mode = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
}

message LockParty {
  int32 pid = 1;
  string application_name = 2;
  string query = 3;
  map<string, string> query_tags = 4;
}

message GetLockWaitSeriesRequest {
  string server_name = 1;
  string database_name = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message GetLockWaitSeriesResponse {
  repeated MetricPoint wait_seconds = 1;
  int64 bucket_ms = 2;
}
