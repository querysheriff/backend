syntax = "proto3";

package querysheriff.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/querysheriff/backend/gen/querysheriff/v1;querysheriffv1";

service HealthService {
  rpc ReportHealth(ReportHealthRequest) returns (ReportHealthResponse) {}

  rpc ListServers(ListServersRequest) returns (ListServersResponse) {}
}

message ReportHealthRequest {
  google.protobuf.Timestamp collected_at = 1;
  repeated string databases = 2;
}

message ReportHealthResponse {}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message Server {
  string server_name = 1;
  repeated string databases = 2;
  google.protobuf.Timestamp last_seen_at = 3;
}
